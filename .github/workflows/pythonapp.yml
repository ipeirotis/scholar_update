name: Python application

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PROJECT_ID: scholar-pub-data
  REGION: us-central1
  LOCATION: $REGION
  FUNCTION_NAME: scholar-update
  RUNTIME_SA: scholar-update-runtime@scholar-pub-data.iam.gserviceaccount.com

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-
      
    - name: Install dependencies using pip
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
  deploy:
    needs: lint
    # Deploy only from master; pull requests run the lint job alone
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ env.PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}
             
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      
    - name: Deploy Cloud Function
      run: |
        gcloud functions deploy ${{ env.FUNCTION_NAME }} --gen2 --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} --entry-point update_scholar_profile --runtime python312 --trigger-http --service-account ${{ env.RUNTIME_SA }}

    # Deploy keeps an existing function's invoker policy, and this identity cannot edit Cloud Run IAM,
    # so check the result instead: an unauthenticated call must be rejected
    - name: Check the function is not publicly invokable
      run: |
        URL=$(gcloud functions describe ${{ env.FUNCTION_NAME }} --gen2 --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} --format 'value(url)')
        CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL" -H 'Content-Type: application/json' -d '{}')
        echo "Unauthenticated call to $URL returned HTTP $CODE"
        if [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
          echo "::error::${{ env.FUNCTION_NAME }} accepts unauthenticated calls; remove the allUsers roles/run.invoker binding"
          exit 1
        fi

